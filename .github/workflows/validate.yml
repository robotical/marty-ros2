name: ROS Jazzy validation
on: [push, pull_request]
jobs:
  ros:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/validate_ros.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-validation
          path: .validation/
